name: tests

on:
  push:
    branches: [master, mlops-experiments]
  pull_request:
  workflow_dispatch:

jobs:
  # macOS only, and not for the usual reasons. pyproject.toml scopes torch to
  # the pytorch-cu130 index on Windows and Linux, so a Linux runner downloads
  # the whole CUDA stack (15 nvidia-* wheels) to run tests that skip without a
  # GPU. Measured on the first real run of this workflow:
  #
  #   macos-latest    2m35s
  #   ubuntu-latest  28m24s, against a 30-minute timeout
  #
  # Ubuntu passed with 96 seconds to spare, which is luck rather than margin.
  # There is no cheap fix on Linux: PyPI's default linux torch wheel is itself
  # the CUDA build, so `--no-sources` and `--torch-backend cpu` both still
  # resolve the full nvidia set, and pinning a CPU index in CI would mean
  # testing a dependency set no user ever installs.
  #
  # macOS is the one platform pyproject already routes to a CPU torch, and
  # these tests are pure CPU logic, so it gives the same coverage in a
  # eleventh of the time.
  pytest:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: astral-sh/setup-uv publishes no moving `v9` major tag,
      # only `v9.0.0`, and `@v9` fails to resolve at all.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --frozen

      - run: uv run pytest -q tests
